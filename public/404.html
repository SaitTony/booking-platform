<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Перенаправление…</title>
    <script>
      // Keep clean URLs such as /workflows/anna on GitHub Pages.
      const base = '/workflows'
      const requested = window.location.pathname + window.location.search + window.location.hash
      sessionStorage.setItem('spa-redirect', requested)
      window.location.replace(base + '/')
    </script>
  </head>
  <body></body>
</html>
