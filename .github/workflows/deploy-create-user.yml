name: Deploy create-user Edge Function

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-create-user:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: cetcxttaqtberrntsntr
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check deployment credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::GitHub secret SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi

      - name: Deploy create-user function
        run: supabase functions deploy create-user --project-ref "$SUPABASE_PROJECT_ID"
