name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/create-user/**"
      - "supabase/functions/assign-user-role/**"
      - "supabase/functions/owner-set-account-status/**"
      - "supabase/functions/change-password/**"
      - "supabase/functions/owner-reset-access/**"
      - "supabase/functions/owner-delete-user/**"
      - "supabase/functions/owner-delete-company/**"
      - "supabase/functions/owner-update-account-name/**"
      - ".github/workflows/deploy-create-user.yml"

permissions:
  contents: read

jobs:
  deploy-create-user:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: cetcxttaqtberrntsntr
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Check deployment credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::GitHub secret SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi

      - name: Deploy assign-user-role function
        run: supabase functions deploy assign-user-role --project-ref "$SUPABASE_PROJECT_ID" --yes

      - name: Deploy create-user function
        run: supabase functions deploy create-user --project-ref "$SUPABASE_PROJECT_ID" --yes

      - name: Deploy owner-set-account-status function
        run: supabase functions deploy owner-set-account-status --project-ref "$SUPABASE_PROJECT_ID" --yes

      - name: Deploy change-password function
        run: supabase functions deploy change-password --project-ref "$SUPABASE_PROJECT_ID" --yes

      - name: Deploy owner-reset-access function
        run: supabase functions deploy owner-reset-access --project-ref "$SUPABASE_PROJECT_ID" --yes

      - name: Deploy owner-delete-user function
        run: supabase functions deploy owner-delete-user --project-ref "$SUPABASE_PROJECT_ID" --yes

      - name: Deploy owner-delete-company function
        run: supabase functions deploy owner-delete-company --project-ref "$SUPABASE_PROJECT_ID" --yes

      - name: Deploy owner-update-account-name function
        run: supabase functions deploy owner-update-account-name --project-ref "$SUPABASE_PROJECT_ID" --yes
