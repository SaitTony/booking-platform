name: Validate Booking Space

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# Avoid pulling multiple disposable Supabase stacks for the same branch at once.
concurrency:
  group: booking-space-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-backend-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install

      - name: TypeScript and Vite build
        run: npm run build

      - name: Setup Supabase CLI
        id: setup-supabase
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Start disposable local Supabase stack
        run: supabase start

      - name: Apply every migration to the disposable local database
        run: supabase db reset

      - name: Check migration status
        run: supabase migration list

      - name: Run database functional tests
        run: supabase test db

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Functions
        run: |
          deno check supabase/functions/create-user/index.ts
          deno check supabase/functions/assign-user-role/index.ts
          deno check supabase/functions/change-password/index.ts
          deno check supabase/functions/owner-reset-access/index.ts

      - name: Stop disposable local Supabase stack
        if: always() && steps.setup-supabase.outcome == 'success'
        run: supabase stop --no-backup
